<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14171F">
<title>Life OS</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="update-banner"><span>New version available</span><button id="update-btn">Update</button></div>

  <header class="topbar">
    <h1 id="topbar-title">Life OS</h1>
    <div style="display:flex; gap:2px;">
      <button class="icon-btn" id="assistant-btn" aria-label="Assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="13" r="1.2"/><circle cx="15" cy="13" r="1.2"/><path d="M9 17h6"/></svg></button>
      <button class="icon-btn" id="notif-btn" aria-label="Notifications" style="position:relative;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="notif-dot" style="display:none; position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--clay);"></span></button>
      <button class="icon-btn" id="search-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
      <button class="icon-btn" id="lock-btn" aria-label="Lock app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </header>

  <main id="main">
    <!-- HOME -->
    <section class="screen" id="screen-home"></section>
    <!-- PLAN -->
    <section class="screen" id="screen-plan"></section>
    <!-- MONEY -->
    <section class="screen" id="screen-money"></section>
    <!-- GROW -->
    <section class="screen" id="screen-grow"></section>
    <!-- MORE -->
    <section class="screen" id="screen-more"></section>
    <!-- generic module list/detail/form render target -->
    <section class="screen" id="screen-module"></section>
    <!-- search -->
    <section class="screen" id="screen-search"></section>
  </main>

  <button class="fab" id="fab" aria-label="Quick add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="home"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span><span class="tl">Home</span></button>
      <button class="tab" data-tab="plan"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span class="tl">Plan</span></button>
      <button class="tab" data-tab="money"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 6V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg></span><span class="tl">Money</span></button>
      <button class="tab" data-tab="grow"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C7 12 5 9 5 5c4 0 7 2 7 7z"/><path d="M12 12c5 0 7-3 7-7-4 0-7 2-7 7z"/></svg></span><span class="tl">Grow</span></button>
      <button class="tab" data-tab="more"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></span><span class="tl">More</span></button>
    </div>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"><div class="sheet-handle"></div><button class="sheet-close" id="sheet-close">✕</button><div id="sheet-content"></div></div>

  <div id="toast"></div>

  <div id="lock-screen">
    <div style="font-size:30px;">🔒</div>
    <div style="font-family:var(--font-display); font-size:18px; margin-top:10px;" id="lock-title">Enter PIN</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-pad" id="pin-pad"></div>
    <button class="btn ghost sm" id="lock-fingerprint" style="margin-top:16px; width:auto; display:none;">🫆 Use fingerprint / Face ID</button>
    <button class="btn ghost sm" id="lock-forgot" style="margin-top:14px; width:auto;">Forgot PIN? Reset app lock</button>
  </div>

  <div id="onboarding-screen">
    <div id="onboarding-content" style="width:100%; max-width:400px;"></div>
  </div>

</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
