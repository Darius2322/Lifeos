<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14171F">
<title>Life OS</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<style>
:root{
  --ink:#14171F; --panel:#1C2029; --panel-2:#232836; --line:#2C3140;
  --gold:#D9A94F; --sage:#7FA88C; --clay:#C4694A; --blue:#8FA6C9; --violet:#B98FC9;
  --paper:#F2EFE7; --fog:#A8AEBC; --fog-dim:#6B7282;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --font-display: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: "SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme: dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--ink); color:var(--paper); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button{font-family:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

#app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:rgba(20,23,31,0.92); backdrop-filter:blur(10px);
  padding:14px 18px 10px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.topbar h1{font-family:var(--font-display); font-size:20px; font-weight:600; margin:0; letter-spacing:0.2px;}
.topbar .icon-btn{background:none;border:none;color:var(--paper);font-size:20px;cursor:pointer;padding:6px;border-radius:var(--r-sm);}
.topbar .icon-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

/* ---------- Screens ---------- */
main{flex:1; padding:16px 18px 100px;}
.screen{display:none;}
.screen.active{display:block; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ---------- Cards ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; margin-bottom:14px;}
.card h2{font-family:var(--font-display); font-size:16px; margin:0 0 10px; font-weight:600; color:var(--paper);}
.card h2 .em{margin-right:6px;}
.section-label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--fog-dim); margin:22px 0 8px; font-weight:600;}
.section-label:first-child{margin-top:0;}

/* ---------- Dashboard greeting ---------- */
.greeting{font-family:var(--font-display); font-size:26px; font-weight:600; margin:4px 0 2px;}
.greeting-date{color:var(--fog); font-size:13px; margin-bottom:18px;}

/* ---------- Life Ring (signature element) ---------- */
.ring-wrap{display:flex; align-items:center; gap:18px;}
.ring-legend{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:12px;}
.ring-legend .li{display:flex; align-items:center; gap:6px; color:var(--fog);}
.ring-legend .dot{width:8px; height:8px; border-radius:50%; flex:none;}
.ring-legend b{color:var(--paper); font-weight:600;}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stat{background:var(--panel-2); border-radius:var(--r-md); padding:12px 10px; text-align:center;}
.stat .n{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--gold);}
.stat .l{font-size:10.5px; color:var(--fog); margin-top:3px; line-height:1.3;}

/* ---------- List rows ---------- */
.row{
  display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.row:last-child{border-bottom:none;}
.row .row-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--panel-2);}
.row .row-body{flex:1; min-width:0;}
.row .row-title{font-size:14.5px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .row-sub{font-size:12px; color:var(--fog); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .row-amt{font-family:var(--font-mono); font-size:13.5px; font-weight:600; flex:none;}
.row .chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--fog-dim); flex:none; display:flex; align-items:center; justify-content:center;}
.row .chk.done{background:var(--sage); border-color:var(--sage); color:var(--ink); font-weight:700;}
.empty{text-align:center; padding:36px 10px; color:var(--fog);}
.empty .em{font-size:32px; display:block; margin-bottom:10px;}
.empty p{margin:0; font-size:13.5px; line-height:1.5;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--gold); color:#1A1406; border:none; border-radius:var(--r-md);
  padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; width:100%;
}
.btn:focus-visible{outline:2px solid var(--paper); outline-offset:2px;}
.btn.ghost{background:var(--panel-2); color:var(--paper); border:1px solid var(--line); font-weight:600;}
.btn.danger{background:var(--clay); color:#241009;}
.btn.sm{width:auto; padding:9px 14px; font-size:13px;}
.btn-row{display:flex; gap:10px; margin-top:14px;}

/* ---------- Forms ---------- */
label{display:block; font-size:12px; color:var(--fog); margin:14px 0 6px; font-weight:600;}
label:first-child{margin-top:0;}
input,select,textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--paper);
  border-radius:var(--r-sm); padding:11px 12px; font-size:14.5px; font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}
textarea{min-height:80px; resize:vertical;}
.field-hint{font-size:11px; color:var(--fog-dim); margin-top:4px;}

/* ---------- Bottom nav ---------- */
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:rgba(28,32,41,0.96); backdrop-filter:blur(14px); border-top:1px solid var(--line);
  display:flex; justify-content:center;
}
.tabbar-inner{max-width:560px; width:100%; display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.tab{flex:1; background:none; border:none; color:var(--fog-dim); display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; cursor:pointer; border-radius:var(--r-sm);}
.tab .ti{font-size:19px;}
.tab .tl{font-size:10px; font-weight:600; letter-spacing:0.2px;}
.tab.active{color:var(--gold);}
.tab:focus-visible{outline:2px solid var(--gold);}

/* ---------- FAB ---------- */
.fab{
  position:fixed; right:calc(50% - 280px + 18px); bottom:78px; z-index:35;
  width:56px; height:56px; border-radius:50%; background:var(--gold); color:#1A1406;
  border:none; font-size:26px; font-weight:400; box-shadow:0 6px 20px rgba(0,0,0,0.4); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
@media (max-width:596px){ .fab{right:18px;} }
.fab:focus-visible{outline:2px solid var(--paper);}

/* ---------- Sheet / modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(8,9,13,0.6); z-index:50; display:none;}
.overlay.open{display:block;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--panel);
  border-radius:20px 20px 0 0; max-height:88vh; overflow-y:auto; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .22s ease; max-width:560px; margin:0 auto;
}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 14px;}
.sheet-title{font-family:var(--font-display); font-size:19px; font-weight:600; margin:0 0 4px;}
.sheet-close{position:absolute; top:16px; right:16px; background:none; border:none; color:var(--fog); font-size:20px; cursor:pointer;}

/* ---------- Quick add grid ---------- */
.qa-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px;}
.qa-item{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 6px; text-align:center; cursor:pointer;}
.qa-item .em{font-size:22px; display:block; margin-bottom:6px;}
.qa-item .l{font-size:10.5px; color:var(--fog); font-weight:600;}

/* ---------- Module tiles (More screen) ---------- */
.tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; cursor:pointer;}
.tile .em{font-size:22px;}
.tile .l{font-size:13.5px; font-weight:600; margin-top:8px;}
.tile .d{font-size:11px; color:var(--fog); margin-top:2px;}

/* ---------- Segmented control ---------- */
.segmented{display:flex; background:var(--panel-2); border-radius:var(--r-sm); padding:3px; margin-bottom:14px; border:1px solid var(--line);}
.segmented button{flex:1; background:none; border:none; color:var(--fog); padding:8px 4px; font-size:12.5px; font-weight:600; border-radius:6px; cursor:pointer;}
.segmented button.active{background:var(--gold); color:#1A1406;}

/* ---------- Chips ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{background:var(--panel-2); border:1px solid var(--line); color:var(--fog); font-size:12px; padding:6px 12px; border-radius:99px; cursor:pointer; font-weight:600;}
.chip.active{background:var(--gold); color:#1A1406; border-color:var(--gold);}

/* ---------- Toast / banner ---------- */
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); background:var(--paper); color:#14171F; padding:11px 18px; border-radius:99px; font-size:13px; font-weight:600; z-index:80; opacity:0; transition:all .25s ease; pointer-events:none; white-space:nowrap;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#update-banner{position:fixed; top:0; left:0; right:0; z-index:90; background:var(--gold); color:#1A1406; padding:10px 16px; display:none; align-items:center; justify-content:space-between; font-size:13px; font-weight:600;}
#update-banner.show{display:flex;}
#update-banner button{background:#1A1406; color:var(--gold); border:none; border-radius:8px; padding:7px 12px; font-weight:700; font-size:12px; cursor:pointer;}

/* ---------- Lock screen ---------- */
#lock-screen{position:fixed; inset:0; z-index:200; background:var(--ink); display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
#lock-screen.show{display:flex;}
.pin-dots{display:flex; gap:14px; margin:24px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--fog-dim);}
.pin-dot.filled{background:var(--gold); border-color:var(--gold);}
.pin-pad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
.pin-key{width:64px; height:64px; border-radius:50%; background:var(--panel-2); border:1px solid var(--line); color:var(--paper); font-size:20px; font-weight:600; cursor:pointer;}
.pin-key:active{background:var(--panel);}

/* ---------- Progress bar ---------- */
.pbar{height:8px; background:var(--panel-2); border-radius:99px; overflow:hidden; margin-top:8px;}
.pbar > div{height:100%; border-radius:99px;}

/* ---------- Detail view header ---------- */
.detail-back{background:none; border:none; color:var(--fog); font-size:13px; font-weight:600; cursor:pointer; padding:6px 0; margin-bottom:10px; display:flex; align-items:center; gap:4px;}
.kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--fog);}
.kv .v{font-weight:600; text-align:right;}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">

  <div id="update-banner"><span>New version available</span><button id="update-btn">Update</button></div>

  <header class="topbar">
    <h1 id="topbar-title">Life OS</h1>
    <div style="display:flex; gap:4px;">
      <button class="icon-btn" id="search-btn" aria-label="Search">🔍</button>
      <button class="icon-btn" id="lock-btn" aria-label="Lock app">🔒</button>
    </div>
  </header>

  <main id="main">
    <!-- HOME -->
    <section class="screen" id="screen-home"></section>
    <!-- PLAN -->
    <section class="screen" id="screen-plan"></section>
    <!-- MONEY -->
    <section class="screen" id="screen-money"></section>
    <!-- GROW -->
    <section class="screen" id="screen-grow"></section>
    <!-- MORE -->
    <section class="screen" id="screen-more"></section>
    <!-- generic module list/detail/form render target -->
    <section class="screen" id="screen-module"></section>
    <!-- search -->
    <section class="screen" id="screen-search"></section>
  </main>

  <button class="fab" id="fab" aria-label="Quick add">+</button>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="home"><span class="ti">🏠</span><span class="tl">Home</span></button>
      <button class="tab" data-tab="plan"><span class="ti">🗓️</span><span class="tl">Plan</span></button>
      <button class="tab" data-tab="money"><span class="ti">💰</span><span class="tl">Money</span></button>
      <button class="tab" data-tab="grow"><span class="ti">🌱</span><span class="tl">Grow</span></button>
      <button class="tab" data-tab="more"><span class="ti">⋯</span><span class="tl">More</span></button>
    </div>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet"><div class="sheet-handle"></div><button class="sheet-close" id="sheet-close">✕</button><div id="sheet-content"></div></div>

  <div id="toast"></div>

  <div id="lock-screen">
    <div style="font-size:30px;">🔒</div>
    <div style="font-family:var(--font-display); font-size:18px; margin-top:10px;" id="lock-title">Enter PIN</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-pad" id="pin-pad"></div>
    <button class="btn ghost sm" id="lock-forgot" style="margin-top:18px; width:auto;">Forgot PIN? Reset app lock</button>
  </div>

</div>

<script>
(function(){
"use strict";

/* =========================================================================
   DATABASE LAYER — IndexedDB, versioned, generic CRUD. Everything local.
   ========================================================================= */
const DB_NAME = "lifeos";
const DB_VERSION = 1;
// Stores implemented in this phase. Additional modules (inventory, documents,
// contacts, travel, reading, workouts, timeline, achievements...) are planned
// for a later DB_VERSION bump — see README notes at bottom of file.
const STORES = [
  {name:"profile", key:"id"},
  {name:"settings", key:"id"},
  {name:"tasks", key:"id", indexes:["dueDate","status"]},
  {name:"reminders", key:"id", indexes:["dueDate"]},
  {name:"notes", key:"id", indexes:["updatedAt"]},
  {name:"expenses", key:"id", indexes:["date","category"]},
  {name:"income", key:"id", indexes:["date","category"]},
  {name:"budgets", key:"id", indexes:["category"]},
  {name:"debts", key:"id", indexes:["status"]},
  {name:"debtPayments", key:"id", indexes:["debtId"]},
  {name:"subscriptions", key:"id", indexes:["nextPaymentDate"]},
  {name:"personalGoals", key:"id", indexes:["status"]},
  {name:"habits", key:"id"},
  {name:"habitCompletions", key:"id", indexes:["habitId","date"]},
  {name:"journal", key:"id", indexes:["date"]},
  {name:"gratitude", key:"id", indexes:["date"]},
  {name:"moods", key:"id", indexes:["date"]},
  {name:"reviews", key:"id", indexes:["type","date"]},
  {name:"tags", key:"id"},
  {name:"appData", key:"id"}
];

const DB = {
  _db:null,
  open(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        STORES.forEach(s=>{
          if(!db.objectStoreNames.contains(s.name)){
            const store = db.createObjectStore(s.name, {keyPath:s.key});
            (s.indexes||[]).forEach(ix=> store.createIndex(ix, ix, {unique:false}));
          }
        });
      };
      req.onsuccess = ()=>{ this._db = req.result; resolve(this._db); };
      req.onerror = ()=> reject(req.error);
    });
  },
  tx(store, mode="readonly"){ return this._db.transaction(store, mode).objectStore(store); },
  add(store, obj){ return new Promise((res,rej)=>{ const r=this.tx(store,"readwrite").add(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); }); },
  put(store, obj){ return new Promise((res,rej)=>{ const r=this.tx(store,"readwrite").put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); }); },
  get(store, id){ return new Promise((res,rej)=>{ const r=this.tx(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  getAll(store){ return new Promise((res,rej)=>{ const r=this.tx(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); },
  delete(store, id){ return new Promise((res,rej)=>{ const r=this.tx(store,"readwrite").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  clear(store){ return new Promise((res,rej)=>{ const r=this.tx(store,"readwrite").clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  async byIndex(store, index, value){
    const all = await this.getAll(store);
    return all.filter(x=>x[index]===value);
  }
};

/* =========================================================================
   UTILITIES
   ========================================================================= */
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayStr = ()=> new Date().toISOString().slice(0,10);
const nowISO = ()=> new Date().toISOString();
let SETTINGS = {id:"main", name:"", currency:"KSh", theme:"dark", pinHash:null, lockTimeoutMin:2, weekStart:1};

function fmtMoney(n){
  const v = Number(n||0);
  const s = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
  return (v<0? "-":"") + SETTINGS.currency + " " + s;
}
function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
}
function daysUntil(d){
  if(!d) return null;
  const dt = new Date(d+"T00:00:00"), t = new Date(todayStr()+"T00:00:00");
  return Math.round((dt-t)/86400000);
}
function greetingWord(){
  const h = new Date().getHours();
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  return "Good evening";
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove("show"), 2200);
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* =========================================================================
   MODULE SCHEMA — drives generic list/form UI for record-style modules.
   ========================================================================= */
const MODULES = {
  tasks: {
    label:"Tasks", icon:"📝", color:"var(--gold)", store:"tasks",
    fields:[
      {key:"title", label:"Task", type:"text", required:true},
      {key:"dueDate", label:"Due date", type:"date"},
      {key:"priority", label:"Priority", type:"select", options:["Normal","High","Top 3"]},
      {key:"notes", label:"Notes", type:"textarea"}
    ],
    title:r=>r.title, sub:r=> r.dueDate? "Due "+fmtDate(r.dueDate) : "No due date",
    checkable:true
  },
  reminders: {
    label:"Reminders", icon:"⏰", color:"var(--blue)", store:"reminders",
    fields:[
      {key:"title", label:"Reminder", type:"text", required:true},
      {key:"dueDate", label:"When", type:"date", required:true},
      {key:"notes", label:"Notes", type:"textarea"}
    ],
    title:r=>r.title, sub:r=> r.dueDate? fmtDate(r.dueDate): "", checkable:true
  },
  notes: {
    label:"Notes", icon:"📌", color:"var(--violet)", store:"notes",
    fields:[
      {key:"title", label:"Title", type:"text", required:true},
      {key:"body", label:"Note", type:"textarea"},
      {key:"tags", label:"Tags (comma separated)", type:"text"}
    ],
    title:r=>r.title, sub:r=> (r.body||"").slice(0,60)
  },
  expenses: {
    label:"Expenses", icon:"💸", color:"var(--clay)", store:"expenses",
    fields:[
      {key:"description", label:"What was it for?", type:"text", required:true},
      {key:"amount", label:"Amount", type:"number", required:true},
      {key:"category", label:"Category", type:"select", options:["Food","Transport","Bills","Rent","Health","Shopping","Entertainment","Education","Other"]},
      {key:"date", label:"Date", type:"date", required:true},
      {key:"notes", label:"Notes", type:"textarea"}
    ],
    title:r=>r.description, sub:r=> r.category+" • "+fmtDate(r.date), amount:r=>-r.amount
  },
  income: {
    label:"Income", icon:"💵", color:"var(--sage)", store:"income",
    fields:[
      {key:"description", label:"Source", type:"text", required:true},
      {key:"amount", label:"Amount", type:"number", required:true},
      {key:"category", label:"Category", type:"select", options:["Salary","Business","Freelance","Gift","Other"]},
      {key:"date", label:"Date", type:"date", required:true},
      {key:"notes", label:"Notes", type:"textarea"}
    ],
    title:r=>r.description, sub:r=> r.category+" • "+fmtDate(r.date), amount:r=>r.amount
  },

/* =========================================================================
   HABITS — custom logic (streaks) beyond generic CRUD
   ========================================================================= */
async function habitStreak(habitId){
  const comps = (await DB.byIndex("habitCompletions","habitId",habitId)).map(c=>c.date).sort();
  if(!comps.length) return 0;
  const set = new Set(comps);
  let streak = 0, d = new Date(todayStr()+"T00:00:00");
  // if today not done yet, streak counts back from yesterday
  if(!set.has(todayStr())) d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){
    streak++; d.setDate(d.getDate()-1);
  }
  return streak;
}
async function toggleHabitToday(habitId){
  const all = await DB.byIndex("habitCompletions","habitId",habitId);
  const today = all.find(c=>c.date===todayStr());
  if(today){ await DB.delete("habitCompletions", today.id); }
  else { await DB.add("habitCompletions", {id:uid(), habitId, date:todayStr()}); }
}

let STATE = { tab:"home", stack:[] }; // stack holds {view, module, id} for module screen

function setTab(tab){
  STATE.tab = tab; STATE.stack = [];
  document.querySelectorAll(".tab").forEach(b=> b.classList.toggle("active", b.dataset.tab===tab));
  document.querySelectorAll(".screen").forEach(s=> s.classList.remove("active"));
  document.getElementById("screen-"+tab).classList.add("active");
  renderTab(tab);
}
function pushModule(view, module, id){
  STATE.stack.push({view, module, id});
  document.querySelectorAll(".screen").forEach(s=> s.classList.remove("active"));
  document.getElementById("screen-module").classList.add("active");
  renderModuleScreen();
}
function popModule(){
  STATE.stack.pop();
  if(STATE.stack.length===0){ setTab(STATE.tab); return; }
  document.getElementById("screen-module").classList.add("active");
  renderModuleScreen();
}

function renderTab(tab){
  if(tab==="home") renderHome();
  else if(tab==="plan") renderPlan();
  else if(tab==="money") renderMoney();
  else if(tab==="grow") renderGrow();
  else if(tab==="more") renderMore();
}

   HOME / DASHBOARD  (includes the six-dimension Life Ring — signature UI)
   ========================================================================= */
const RING_DIMS = [
  {key:"productivity", label:"Productivity", color:"var(--gold)"},
  {key:"finance", label:"Finance", color:"var(--sage)"},
  {key:"growth", label:"Growth", color:"var(--blue)"},
  {key:"habits", label:"Habits", color:"var(--violet)"},
  {key:"lifestyle", label:"Lifestyle", color:"var(--clay)"},
  {key:"reflection", label:"Reflection", color:"#E0C878"}
];

function ringSVG(scores){
  const size=132, cx=size/2, cy=size/2, r=52, thickness=13, gapDeg=5;
  const segDeg = 360/RING_DIMS.length;
  const polarToXY = (angleDeg, radius)=>{
    const a = (angleDeg-90) * Math.PI/180;
    return [cx + radius*Math.cos(a), cy + radius*Math.sin(a)];
  };
  function arcPath(startDeg, endDeg, radius){
    const [x1,y1] = polarToXY(startDeg, radius), [x2,y2] = polarToXY(endDeg, radius);
    const large = (endDeg-startDeg) > 180 ? 1:0;
    return `M ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2}`;
  }
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  RING_DIMS.forEach((d,i)=>{
    const start = i*segDeg + gapDeg/2, end = (i+1)*segDeg - gapDeg/2;
    const pct = Math.max(0.04, Math.min(1, (scores[d.key]||0)/100));
    const filledEnd = start + (end-start)*pct;
    svg += `<path d="${arcPath(start,end,r)}" stroke="var(--line)" stroke-width="${thickness}" fill="none" stroke-linecap="round"/>`;
    svg += `<path d="${arcPath(start,filledEnd,r)}" stroke="${d.color}" stroke-width="${thickness}" fill="none" stroke-linecap="round"/>`;
  });
  const overall = Math.round(RING_DIMS.reduce((s,d)=>s+(scores[d.key]||0),0)/RING_DIMS.length);
  svg += `<text x="${cx}" y="${cy-2}" text-anchor="middle" fill="var(--paper)" font-size="20" font-weight="700" font-family="var(--font-mono)">${overall}</text>`;
  svg += `<text x="${cx}" y="${cy+15}" text-anchor="middle" fill="var(--fog)" font-size="9" font-family="var(--font-body)">balance</text>`;
  svg += `</svg>`;
  return svg;
}

async function computeLifeScores(){
  const since7 = (n)=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
  const [tasks, journal, expenses, income, goals, habits, habitComps, moods] = await Promise.all([
    DB.getAll("tasks"), DB.getAll("journal"), DB.getAll("expenses"), DB.getAll("income"),
    DB.getAll("personalGoals"), DB.getAll("habits"), DB.getAll("habitCompletions"), DB.getAll("moods")
  ]);
  const last7 = since7(7);
  // Productivity: tasks completed in last 7 days vs created in last 7 days
  const recentTasks = tasks.filter(t=> (t.createdAt||"").slice(0,10) >= last7 || (t.dueDate||"") >= last7);
  const doneRecent = recentTasks.filter(t=>t.done).length;
  const productivity = recentTasks.length? Math.round(100*doneRecent/recentTasks.length) : (tasks.length? 40:20);
  // Finance: did they log any money activity in last 7 days + are budgets respected
  const recentMoney = [...expenses, ...income].filter(x=> x.date >= last7).length;
  const finance = Math.min(100, recentMoney*15 + (expenses.length||income.length? 20:0));
  // Growth: active goals with recent progress
  const activeGoals = goals.filter(g=>g.status!=="Completed");
  const growth = goals.length? Math.min(100, Math.round(40 + activeGoals.reduce((s,g)=>s+(Number(g.progress)||0),0)/Math.max(1,activeGoals.length)*0.6)) : 15;
  // Habits: average streak ratio capped
  let habitsScore = 15;
  if(habits.length){
    const streaks = await Promise.all(habits.map(h=>habitStreak(h.id)));
    habitsScore = Math.min(100, Math.round(streaks.reduce((s,x)=>s+x,0)/habits.length * 12));
  }
  // Lifestyle: mood entries recency
  const recentMoods = moods.filter(m=>m.date>=last7).length;
  const lifestyle = Math.min(100, recentMoods*20 + 10);
  // Reflection: journal entries in last 7 days
  const recentJournal = journal.filter(j=>j.date>=last7).length;
  const reflection = Math.min(100, recentJournal*20 + 10);
  return {productivity, finance, growth, habits:habitsScore, lifestyle, reflection};
}

  `;

  el2.querySelector("#mf-save").addEventListener("click", async (e)=>{
    e.preventDefault();
    const rec = existing || {id:uid(), createdAt:nowISO()};
    let ok = true;
    cfg.fields.forEach(f=>{
      const node = document.getElementById("mf_"+f.key);
      const val = node.value;

function fieldHTML(f, existing){
  const val = existing? (existing[f.key]!=null? existing[f.key]:"") : (f.type==="date"? "" : "");
  if(f.type==="textarea") return `<label>${f.label}</label><textarea id="mf_${f.key}">${esc(val)}</textarea>`;
  if(f.type==="select") return `<label>${f.label}</label><select id="mf_${f.key}">${f.options.map(o=>`<option ${String(val)===o?'selected':''}>${esc(o)}</option>`).join("")}</select>`;
  return `<label>${f.label}</label><input id="mf_${f.key}" type="${f.type}" value="${esc(val)}" ${f.type==='number'?'step="any"':''}>`;
}

async function runSearch(q){
  const out = document.getElementById("search-results");
  if(!q || q.trim().length<1){ out.innerHTML=""; return; }
  const needle = q.trim().toLowerCase();
  let html = "";
  for(const [key, cfg] of Object.entries(MODULES)){
    const all = await DB.getAll(cfg.store);
    const hits = all.filter(r=> JSON.stringify(r).toLowerCase().includes(needle));
    if(hits.length){
      html += `<div class="section-label">${cfg.label} — ${hits.length}</div><div class="card">`;
      html += hits.slice(0,10).map(r=>`<div class="row" data-open="${key}|${r.id}"><div class="row-icon">${cfg.icon}</div><div class="row-body"><div class="row-title">${esc(cfg.title(r))}</div><div class="row-sub">${esc(cfg.sub?cfg.sub(r):"")}</div></div></div>`).join("");
      html += `</div>`;
    }
  }
  out.innerHTML = html || `<div class="empty"><span class="em">🔍</span><p>No matches for "${esc(q)}"</p></div>`;
  out.querySelectorAll("[data-open]").forEach(n=>{ const [m,id]=n.dataset.open.split("|"); n.addEventListener("click", ()=>pushModule("detail", m, id)); });
}

async function promptSetPin(){
  const p1 = prompt("Enter a new 4-digit PIN:");
  if(!p1 || !/^\d{4}$/.test(p1)){ if(p1!==null) toast("PIN must be 4 digits"); return; }
  const p2 = prompt("Confirm PIN:");
  if(p1!==p2){ toast("PINs did not match"); return; }
  SETTINGS.pinHash = await hashPin(p1);
  await DB.put("settings", SETTINGS);
  toast("PIN set"); closeSheet();
}
async function hashPin(pin){
  const enc = new TextEncoder().encode("lifeos-salt-"+pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

   BACKUP / RESTORE
   ========================================================================= */
function openBackupSheet(){
  openSheet(`
    <div class="sheet-title">Backup & restore</div>
    <p style="font-size:13px; color:var(--fog); line-height:1.5;">Your data lives only in this browser/app install. Back it up regularly — clearing site data or reinstalling can erase it.</p>
    <button class="btn" id="bk-export">Export full backup (.json)</button>
    <label>Restore from file</label>
    <input type="file" id="bk-import" accept="application/json">
    <div class="chips" style="margin-top:10px;">
      <span class="chip active" data-mode="merge" id="mode-merge">Merge</span>
      <span class="chip" data-mode="replace" id="mode-replace">Replace all</span>
    </div>
    <p class="field-hint">Merge keeps existing records and adds/updates from the file. Replace clears each store first.</p>
  `);
  let mode = "merge";
  document.getElementById("mode-merge").onclick = ()=>{ mode="merge"; document.getElementById("mode-merge").classList.add("active"); document.getElementById("mode-replace").classList.remove("active"); };
  document.getElementById("mode-replace").onclick = ()=>{ mode="replace"; document.getElementById("mode-replace").classList.add("active"); document.getElementById("mode-merge").classList.remove("active"); };
  document.getElementById("bk-export").onclick = exportBackup;
  document.getElementById("bk-import").onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const data = JSON.parse(reader.result);
        await importBackup(data, mode);
        toast("Backup restored"); closeSheet(); setTab(STATE.tab);
      }catch(err){ toast("Could not read that backup file"); }
    };
    reader.readAsText(file);
  };
}
async function exportBackup(){
  const data = {app:"lifeos", version:1, exportDate:nowISO(), stores:{}};
  let recordCount = 0;
  for(const s of STORES){
    const all = await DB.getAll(s.name);
    data.stores[s.name] = all;
    recordCount += all.length;
  }
  data.recordCount = recordCount;
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `lifeos-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`Exported ${recordCount} records`);
}
async function importBackup(data, mode){
  if(!data || data.app!=="lifeos" || !data.stores){ throw new Error("Invalid backup"); }
  for(const s of STORES){
    const records = data.stores[s.name];
    if(!records) continue;
    if(mode==="replace") await DB.clear(s.name);
    for(const r of records){ await DB.put(s.name, r); }
  }
  await loadSettings();
}

/* =========================================================================
   PIN LOCK
   ========================================================================= */
let pinBuffer = "";
function renderPinPad(){
  const pad = document.getElementById("pin-pad");
  pad.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k=>{
    const b = document.createElement("button");
    b.className = "pin-key"; b.textContent = k;
    if(k==="") b.style.visibility="hidden";
    b.addEventListener("click", ()=> handlePinKey(k));
    pad.appendChild(b);
  });
}
function renderPinDots(){
  document.getElementById("pin-dots").innerHTML = [0,1,2,3].map(i=>`<div class="pin-dot ${i<pinBuffer.length?'filled':''}"></div>`).join("");
}
async function handlePinKey(k){
  if(k==="⌫"){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(k==="" || pinBuffer.length>=4) return;
  pinBuffer += k; renderPinDots();
  if(pinBuffer.length===4){
    const hash = await hashPin(pinBuffer);
    if(hash===SETTINGS.pinHash){
      document.getElementById("lock-screen").classList.remove("show");
      pinBuffer = ""; lastActive = Date.now();
    } else {
      setTimeout(()=>{ pinBuffer=""; renderPinDots(); toast("Incorrect PIN"); }, 200);
    }
  }
}
function showLock(){
  if(!SETTINGS.pinHash) return;
  pinBuffer=""; renderPinDots();
  document.getElementById("lock-screen").classList.add("show");
}
let lastActive = Date.now();
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ lastActive = Date.now(); }
  else {
    const away = (Date.now()-lastActive)/60000;
    if(SETTINGS.pinHash && away >= (SETTINGS.lockTimeoutMin||2)) showLock();
  }
});
document.getElementById("lock-btn").addEventListener("click", ()=>{ if(SETTINGS.pinHash) showLock(); else toast("Set a PIN in Settings first"); });
document.getElementById("lock-forgot").addEventListener("click", ()=>{
  if(confirm("Resetting removes the PIN but keeps all your data. Continue?")){
    SETTINGS.pinHash=null; DB.put("settings", SETTINGS).then(()=>{
      document.getElementById("lock-screen").classList.remove("show"); toast("PIN removed");
    });
  }
});

/* =========================================================================
   PWA: install prompt handling + update banner
   ========================================================================= */
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{ e.preventDefault(); deferredInstallPrompt = e; });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./service-worker.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        nw.addEventListener("statechange", ()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            document.getElementById("update-banner").classList.add("show");
          }
        });
      });
    }).catch(()=>{ /* offline-first: app still works fully without SW registration succeeding */ });
  });
}
document.getElementById("update-btn").addEventListener("click", ()=>{
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(reg && reg.waiting){ reg.waiting.postMessage("SKIP_WAITING"); }
    location.reload();
  });
});

async function loadSettings(){
  const s = await DB.get("settings", "main");
  if(s) SETTINGS = Object.assign(SETTINGS, s);
  else await DB.put("settings", SETTINGS);
}

async function init(){
  await DB.open();
  await loadSettings();
  if(SETTINGS.pinHash) showLock();
  renderPinPad();
  setTab("home");
}
init();
